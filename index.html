<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPS Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-grid"></div>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>

    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <span class="logo-icon">⚔️</span>
                <span class="logo-text">RPS <em>Arena</em></span>
            </div>
            <div class="mode-toggle">
                <button class="mode-btn active" id="vs-comp-btn">
                    <i class="fas fa-robot"></i> vs Computer
                </button>
                <button class="mode-btn" id="vs-human-btn">
                    <i class="fas fa-user-friends"></i> vs Human
                </button>
            </div>
        </div>
    </header>

    <main class="main">

        <!-- Score Board -->
        <div class="score-board">
            <div class="score-card">
                <div class="score-num" id="user-score">0</div>
                <div class="score-label" id="score-p1-label">You</div>
            </div>
            <div class="vs-divider">VS</div>
            <div class="score-card">
                <div class="score-num" id="comp-score">0</div>
                <div class="score-label" id="score-p2-label">Computer</div>
            </div>
        </div>

        <!-- Player Tags -->
        <div class="player-tags">
            <span class="ptag" id="p1-tag">You</span>
            <span class="ptag" id="p2-tag">Computer</span>
        </div>

        <!-- Choices -->
        <div class="choices">
            <div class="choice" id="rock" title="Rock">
                <div class="choice-inner">
                    <span class="choice-emoji">✊</span>
                    <span class="choice-label">Rock</span>
                </div>
                <div class="choice-glow"></div>
            </div>
            <div class="choice" id="paper" title="Paper">
                <div class="choice-inner">
                    <span class="choice-emoji">✋</span>
                    <span class="choice-label">Paper</span>
                </div>
                <div class="choice-glow"></div>
            </div>
            <div class="choice" id="scissor" title="Scissors">
                <div class="choice-inner">
                    <span class="choice-emoji">✌️</span>
                    <span class="choice-label">Scissors</span>
                </div>
                <div class="choice-glow"></div>
            </div>
        </div>

        <!-- Computer Choice Display -->
        <div class="comp-choice-container" id="comp-choice-container">
            <span class="comp-choice-label">Computer chose:</span>
            <span class="comp-choice-val" id="comp-choice-text">—</span>
        </div>

        <!-- Message -->
        <div class="msg-container">
            <div id="msg" class="msg">Play your move</div>
        </div>

        <!-- Replay -->
        <div class="replay-wrap">
            <button id="replay-btn" class="replay-btn">
                <i class="fas fa-redo"></i> Reset
            </button>
        </div>

    </main>

    <!-- Player 2 overlay -->
    <div class="overlay" id="overlay">
        <div class="overlay-box">
            <div class="overlay-icon">🕵️</div>
            <h2>Player 2's Turn</h2>
            <p>Player 1 has locked in their move. <br>Player 2 — choose wisely!</p>
            <div class="choices choices-overlay">
                <div class="choice p2-choice" id="p2-rock">
                    <div class="choice-inner">
                        <span class="choice-emoji">✊</span>
                        <span class="choice-label">Rock</span>
                    </div>
                    <div class="choice-glow"></div>
                </div>
                <div class="choice p2-choice" id="p2-paper">
                    <div class="choice-inner">
                        <span class="choice-emoji">✋</span>
                        <span class="choice-label">Paper</span>
                    </div>
                    <div class="choice-glow"></div>
                </div>
                <div class="choice p2-choice" id="p2-scissor">
                    <div class="choice-inner">
                        <span class="choice-emoji">✌️</span>
                        <span class="choice-label">Scissors</span>
                    </div>
                    <div class="choice-glow"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
