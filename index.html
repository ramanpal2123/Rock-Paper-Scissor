<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Rock Paper Scissors</h1>

    <!-- Mode Toggle -->
    <div class="mode-toggle">
        <button class="mode-btn active" id="vs-comp-btn">vs Computer</button>
        <button class="mode-btn" id="vs-human-btn">vs Human</button>
    </div>

    <!-- Player Tags -->
    <div class="player-tags">
        <span id="p1-tag">You</span>
        <span id="p2-tag">Computer</span>
    </div>

    <!-- Choices -->
    <div class="choices">
        <div class="choice" id="rock">
            <img src="Stone.jpg" alt="Rock">
        </div>
        <div class="choice" id="paper">
            <img src="Paper.jpg" alt="Paper">
        </div>
        <div class="choice" id="scissor">
            <img src="Scissor.jpg" alt="Scissor">
        </div>
    </div>

    <!-- Computer/Player2 Choice Display -->
    <div class="comp-choice-container" id="comp-choice-container">
        <p id="comp-choice-tag">Computer chose: <span id="comp-choice-text">-</span></p>
    </div>

    <!-- Score Board -->
    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p id="score-p1-label">You</p>
        </div>
        <div class="score">
            <p id="comp-score">0</p>
            <p id="score-p2-label">Computer</p>
        </div>
    </div>

    <!-- Message -->
    <div class="msg-container">
        <p id="msg">Play your move</p>
    </div>

    <div style="text-align:center; margin: 1rem 0 2rem;">
        <button id="replay-btn">🔄 Replay</button>
    </div>

    <!-- Player 2 turn overlay (Human vs Human) -->
    <div class="overlay" id="overlay">
        <div class="overlay-box">
            <h2>Player 2's Turn</h2>
            <p>Player 1 has made their choice!</p>
            <p>Now Player 2 — pick your move</p>
            <div class="choices">
                <div class="choice p2-choice" id="p2-rock">
                    <img src="Stone.jpg" alt="Rock">
                </div>
                <div class="choice p2-choice" id="p2-paper">
                    <img src="Paper.jpg" alt="Paper">
                </div>
                <div class="choice p2-choice" id="p2-scissor">
                    <img src="Scissor.jpg" alt="Scissor">
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
